name: Android Lint

on:
  push:
    branches: []
  pull_request:
    branches: []

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    # The pinned media submodule resolves the NDK directory at configuration time, before
    # the Android Gradle Plugin gets a chance to download it.
    - name: Install NDK
      run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Check formatting with spotless
      run: ./gradlew spotlessCheck
    - name: Test musikr with Gradle
      run: ./gradlew musikr:testDebug
